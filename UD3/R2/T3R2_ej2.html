<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>T3R2_ej2</title>
</head>
<body>
    <script>
        const colores = ["azul", "amarillo", "rojo", "verde", "café", "rosa"];

        const color = prompt("Escribe un color:").toLowerCase();

        if (colores.includes(color)) {
            document.write("El color " + color + " SÍ está en el array.");
        } else {
            document.write("El color " + color + " NO está en el array.");
        }
    </script>
</body>
</html>
