<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>T3R5_ej4</title>
    <script src="T3R5.js"></script>
</head>

<body>
    <script>
        const filas = parseInt(prompt("Número de filas (5 a 9):"));
        const columnas = parseInt(prompt("Número de columnas (5 a 9):"));

        const mapa = creaMapaTesoro(filas, columnas);

        if (mapa === null) {
            document.write("Dimensiones no válidas: deben estar entre 5 y 9.");
        } else {
            document.write("<b>Mapa generado:</b><br>");
            document.write("<table border='1'>");
            for (let f = 0; f < mapa.length; f++) {
                document.write("<tr>");
                for (let c = 0; c < mapa[f].length; c++) {
                    document.write("<td>" + mapa[f][c] + "</td>");
                }
                document.write("</tr>");
            }
            document.write("</table><br>");

            const visitadas = buscaTesoro(mapa);

            document.write("<b>Búsqueda del tesoro:</b><br>");
            document.write(visitadas.join("<br>"));
            document.write("<br><br><b>¡Tesoro encontrado en la " + visitadas[visitadas.length - 1].split(" →")[0] + "!</b>");
        }
    </script>
</body>

</html>
