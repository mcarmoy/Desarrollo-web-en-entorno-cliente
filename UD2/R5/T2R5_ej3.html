<body>
    <p onclick="abrir5Ventanas()">Haz clic aquí</p>

    <script>
        function abrir5Ventanas() {
            for (let i = 1; i <= 5; i++) {
                
                const v = window.open("", "", "width=350,height=350");
                v.document.write("<h1>ventana " + i + "</h1>");
                v.document.write("<button onclick='window.close()'>Cerrar</button>");
            }
        }
    </script>
