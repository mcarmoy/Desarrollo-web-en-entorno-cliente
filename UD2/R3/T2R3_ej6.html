        const texto = prompt("Escribe la primera cadena:");
        const buscar = prompt("Escribe la segunda cadena:");
        const pos = posicionSubcadena(texto, buscar);

        if (pos === -1) {
            document.write("La segunda cadena NO es una subcadena de la primera");

            document.write("Es una subcadena. Primera posición: " + pos);
