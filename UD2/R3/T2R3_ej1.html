<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <script>
        const frase = prompt("Escribe una frase:");
        const n = parseInt(prompt("Escribe un número para filtrar palabras más largas que él:"));

        document.write("Cadena invertida: " + invierteCadena(frase) + "<br>");
        document.write("Palabras invertidas: " + invierteCadenaPalabras(frase) + "<br>");
        document.write("Longitud de la palabra más larga: " + encuentraPalabraMasLarga(frase) + "<br>");
        document.write("Palabras de más de " + n + " letras: " + filtraPalabrasMasLargas(frase, n) + "<br>");
        document.write("Bien formada: " + cadenaBienFormada(frase));
    </script>
</body>
