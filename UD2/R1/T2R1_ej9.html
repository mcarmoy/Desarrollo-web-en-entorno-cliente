<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>T2R1_ej9</title>
</head>
<body>
    <script>
        const frase = prompt("Escribe una frase:").toLowerCase();
        let contador = 0;

        for (let i = 0; i < frase.length; i++) {
            const letra = frase[i];
            if (letra === "a" || letra === "e" || letra === "i" || letra === "o" || letra === "u") {
                contador++;
            }
        }

        document.write("La frase tiene " + contador + " vocales.");
    </script>
</body>
</html>
