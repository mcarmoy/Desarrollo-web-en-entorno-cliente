<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>T2R1_ej8</title>
</head>
<body>
    <script>
        const frase = prompt("Escribe una frase:").toLowerCase();
        let contador = 0;

        for (let i = 0; i < frase.length; i++) {
            if (frase[i] === "a") {
                contador++;
            }
        }

        document.write("La letra a aparece " + contador + " veces.");
    </script>
</body>
</html>
