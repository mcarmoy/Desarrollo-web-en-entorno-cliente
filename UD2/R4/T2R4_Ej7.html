    <meta charset="UTF-8">

<body>
    <script>
        const hasta = parseInt(prompt("¿Hasta qué número quieres la tabla?"));

        document.write("<table border='1'>");
        document.write("<tr><th>Número</th><th>Seno</th></tr>");

        for (let i = 0; i <= hasta; i++) {
            document.write("<tr><td>" + i + "</td><td>" + seno(i) + "</td></tr>");
        }

        document.write("</table>");
    </script>
</body>
