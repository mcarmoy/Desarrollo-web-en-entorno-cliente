<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T2-ej1</title>
</head>
<body>
    <script>
        // 1. Comparación con doble igual
        let op1 = (20 == 20);
        document.write(`<p> La operación 20==20 es ${op1} </p>`)

        // 2. Comparación estricta
        let op2 = (20===20);
        document.write(`<p> La operación 20===20 es ${op2} </p>`)

        // 3. Comparación estricta con decimal
        let op3 = (20 === 20.0);
        document.write(`<p> La operación 20===20.0 es ${op3} </p>`)

        // 4. Comparación de cadenas de texto
        let op4 = ("Juan" == "juan");
        document.write(`La operación "Juan" == "juan" es ${op4} </p>`)

        // 5. Comparación mayor que con cadenas
        let op5 = ("Juan" > "juan");
        document.write(`<p> La operación "Juan" > "juan" es ${op5} </p>`)

        // 6. Comparación menor que con cadenas
        document.write(`<p> La operación "Juan" < "juan" es ${"Juan" < "juan"} </p>`)

        // 7. Comparación de cadena y número con doble igual
        document.write(`<p> La operación "123" == "123" es ${"123" == "123"} </p>`)

        // 8. Comparación estricta de cadena y número
        document.write(`<p> La operación "123" === "123" es ${"123" === "123"} </p>`)

        // 9. Conversión de cadena a entero con parseInt
        // parseInt convierte una cadena a un entero
        document.write(`<p> La operación parseInt("123") === 123 es ${parseInt("123") === 123}`)
    </script>
</body>
</html>
