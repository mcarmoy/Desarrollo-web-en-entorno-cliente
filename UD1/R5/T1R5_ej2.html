<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T1R5_ej2</title>
</head>

<body>
    <script>
        function squareAndSum(...args) {
            let suma = 0;

            for (let i = 0; i < args.length; i++) {
                suma = suma + args[i] * args[i];
            }

            return suma;
        }

        document.write("(2, 4, 3): " + squareAndSum(2, 4, 3)); // 29
        document.write("<br>");
        document.write("(1, 2): " + squareAndSum(1, 2));    // 5
    </script>
</body>

</html>
