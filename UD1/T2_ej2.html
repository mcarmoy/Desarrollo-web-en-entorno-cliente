<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T2-j2</title>
</head>
<body>
    <script>
        // Pedimos la edad
        let entradaEdad = prompt("Introduce tu edad:")

        // Convertimos el texto a entero
        let edad = parseInt(entradaEdad)

        //Usamos el operador ternario
        //Sintaxis: condicion ? si : no
        let mensaje = (edad >= 18) ? "eres mayor de edad" : "eres menor de edad"

        //Mostramos el mensaje
        document.write(mensaje)
    </script>
</body>
</html>
