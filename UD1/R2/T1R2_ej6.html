<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T1R2-ej6</title>
</head>
<body>
    <script>
        for (let tabla = 1; tabla <= 10; tabla++) {
            document.write('<b>Tabla del ' + tabla + ':</b><br>');
            for (let i = 1; i <= 10; i++) {
                document.write(i + 'x' + tabla + '=' + (i * tabla) + '<br>');
            }
            document.write('<br>');
        }
    </script>
</body>
</html>
