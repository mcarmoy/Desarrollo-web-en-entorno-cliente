<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function sum(...args) {
            let total = 0;

            for (let i = 0; i < args.length; i++) {
                total = total + args[i];
            }

            return total;
        }

    document.write(sum(1, 2, 3));
    document.write("<br>");
    document.write(sum(5, 10));
    document.write("<br>");
    document.write(sum());
    document.write("<br>");
    document.write(sum(1, 2, 3, 4, 5)); 
  </script>
</body>
</html>
