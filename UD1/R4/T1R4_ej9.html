<body>
    <script>
        function tieneTresDigitos(numero) {
            return numero >= 100 && numero <= 999;
        }

        let numero = parseInt(prompt("Introduce un número:"));

        document.write(numero + " tiene 3 dígitos: " + tieneTresDigitos(numero));
    </script>
