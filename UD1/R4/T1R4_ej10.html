<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T1R4_ej10</title>
</head>

<body>
    <script>
        function areaRectangulo(lado1, lado2) {
            return lado1 * lado2;
        }

        let lado1 = parseFloat(prompt("Introduce el lado 1:"));
        let lado2 = parseFloat(prompt("Introduce el lado 2:"));

        document.write("El área del rectángulo es " + areaRectangulo(lado1, lado2));
    </script>
</body>

</html>
