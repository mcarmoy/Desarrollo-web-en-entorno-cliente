<!DOCTYPE html>

<body>
    <script>
        function addOnlyNums(...args) {
            let total = 0;

            for (let i = 0; i < args.length; i++) {
                if (typeof args[i] === "number") {
                total = total + args[i];
                }
            }

            return total;
            }

            document.write(addOnlyNums(1, 'cat', 3, 4)); // 8
    </script>
</body>
