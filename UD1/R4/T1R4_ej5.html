<body>
    <script>
        function sumEveryOther(...args) {
            let total = 0;

            for (let i = 0; i < args.length; i += 2) {
                total = total + args[i];
            }

            return total;
        }

        document.write(sumEveryOther(5, 6, 3, 4, 1));
        document.write("<br>");
        document.write(sumEveryOther(10, 2, 11));
    </script>
</body>
