<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T1R4_ej14</title>
</head>

<body>
    <script>
        function divisible(dividendo, divisor) {
            return dividendo % divisor === 0;
        }

        let dividendo = parseInt(prompt("Introduce el dividendo:"));
        let divisor = parseInt(prompt("Introduce el divisor:"));

        document.write(dividendo + " es divisible entre " + divisor + ": " + divisible(dividendo, divisor));
    </script>
</body>

</html>
